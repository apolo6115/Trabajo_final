<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="http://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="css/materialize.min.css"  media="screen,projection"/>
  <link type="text/css" rel="stylesheet" href="css/customColors.css"  media="screen,projection"/>
  <link type="text/css" rel="stylesheet" href="css/ion.rangeSlider.css"  media="screen,projection"/>
  <link type="text/css" rel="stylesheet" href="css/ion.rangeSlider.skinFlat.css"  media="screen,projection"/>
  <link type="text/css" rel="stylesheet" href="css/index.css"  media="screen,projection"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario</title>
</head>

<body>
  <video src="img/video.mp4" id="vidFondo"></video>

  <div class="contenedor">
    <div class="card rowTitulo">
      <h1>Buscador</h1>
    </div>
    <div class="colFiltros">
      <form action="buscador.php" method="post" id="formulario">
        <div class="filtrosContenido">
          <div class="tituloFiltros">
            <h5>Realiza una búsqueda personalizada</h5>
          </div>
          <div class="filtroCiudad input-field">
<label for="selectCiudad">Ciudad:</label> <br>
            <select name="ciudad" id="selectCiudad" class="browser-default"> 
              <option value="" selected>Elige una ciudad</option>
              <option value="new york">New york</option>
              <option value="Orlando">Orlando</option>
              <option value="Los Angeles">Los Angeles</option>
              <option value="Washington">Washington</option>
              <option value="Miami">Miami</option>
              <option value="Houston">Houston</option>
            </select>
          </div>
          <div class="filtroTipo input-field">
            <label for="selecTipo">Tipo:</label><br>

            <select name="tipo" id="selectTipo" class="browser-default">
              <option value="" selected>Elige un tipo</option>
              <option value="Casa">Casa</option>
              <option value="casa de campo">Casa de Campo</option>
              <option value="Apartamento">Apartamento</option>
            </select>
          </div>
          <div class="filtroPrecio">
            <label for="rangoPrecio">Precio:</label>
            <input type="text" id="rangoPrecio" name="precio" value="" />
          </div>
          <div class="botonField">
            <input type="submit" class="btn white" value="Buscar" id="submitButton">
          </div>
        </div>
      </form>
    </div>

    <div class="colContenido">
      <div class="tituloContenido card">
        <h5>Resultados de la búsqueda:</h5>
        <div class="divider"></div>
        <button type="button" class="btn-flat waves-effect" id="mostrarTodos">Mostrar Todos</button>
      </div>
      <div id="resultados"></div> <!-- Contenedor para los resultados -->
    </div>
  </div>

  <script type="text/javascript" src="js/jquery-3.0.0.js"></script>
  <script type="text/javascript" src="js/ion.rangeSlider.min.js"></script>
  <script type="text/javascript" src="js/materialize.min.js"></script>
  <script type="text/javascript" src="js/index.js"></script>
  <script type="text/javascript">
   $(document).ready(function() {
        if (typeof M !== 'undefined') {
            var elems = document.querySelectorAll('select');
            var instances = M.FormSelect.init(elems);
            console.log("Materialize select initialized with M object");
            
            try {
                $("#rangoPrecio").ionRangeSlider({
                    type: "double",
                    grid: true,
                    min: 0,
                    max: 100000,
                    from: 0,
                    to: 100000,
                    prefix: "$",
                    step: 1000
                });
                console.log("Slider inicializado correctamente");
            } catch (error) {
                console.error("Error al inicializar el slider:", error);
            }
        } else {
            console.error("Materialize no está cargado correctamente");
        }
        
        function cargarOpciones(url, selector) {
            $.ajax({
                url: url,
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    console.log(`Datos recibidos para ${selector}:`, data);
                    const opciones = [...new Set(data.map(item => item[selector]))];
                    opciones.forEach(opcion => {
                        $(`#${selector}`).append(`<option value="${opcion}">${opcion}</option>`);
                    });
                    $('select').formSelect();
                },
                error: function(xhr, status, error) {
                    console.error(`Error al cargar opciones para ${selector}:`, error);
                    console.error("Respuesta del servidor:", xhr.responseText);
                }
            });
        }

        $.ajax({
            url: 'data-1.json',
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                console.log("Archivo data-1.json accesible:", data);
            },
            error: function(xhr, status, error) {
                console.error("Error accediendo a data-1.json:", error);
            }
        });

        const baseUrl = 'mostrarTodos.php';
        
        function mostrarResultados(filtros = {}) {
            console.log('Mostrando resultados con filtros:', filtros);
            
            $('#resultados').html('<div class="progress"><div class="indeterminate"></div></div>');
            
            $.ajax({
                url: 'data-1.json',
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    console.log('Datos recibidos de data-1.json:', data);
                    
                    if (!data || data.length === 0) {
                        $('#resultados').html('<div class="card-panel yellow lighten-4">No se encontraron resultados</div>');
                        return;
                    }
                    
                    let datosFiltrados = data;
                    
                    if (filtros.ciudad && filtros.ciudad !== "") {
                        datosFiltrados = datosFiltrados.filter(item => 
                            item.Ciudad.toLowerCase() === filtros.ciudad.toLowerCase());
                    }
                    
                    if (filtros.tipo && filtros.tipo !== "") {
                        datosFiltrados = datosFiltrados.filter(item => 
                            item.Tipo.toLowerCase() === filtros.tipo.toLowerCase());
                    }
                    
                    if (filtros.precio) {
                        const rangeValues = filtros.precio.split(';');
                        const minPrecio = parseFloat(rangeValues[0]);
                        const maxPrecio = parseFloat(rangeValues[1]);
                        
                        console.log('Filtrando por rango de precio:', minPrecio, 'a', maxPrecio);
                        
                        datosFiltrados = datosFiltrados.filter(item => {
                            const precioTexto = item.Precio.replace(/[^\d.]/g, '');
                            const precio = parseFloat(precioTexto);
                            
                            console.log('Precio del item:', item.Precio, '→', precio);
                            
                            return !isNaN(precio) && precio >= minPrecio && precio <= maxPrecio;
                        });
                    }
                    
                    if (datosFiltrados.length === 0) {
                        $('#resultados').html('<div class="card-panel yellow lighten-4">No se encontraron resultados con los filtros seleccionados</div>');
                        return;
                    }
                    
                    let html = '';
                    datosFiltrados.forEach(function(item) {
                        html += `
                            <div class="itemMostrado">
                                <div class="card horizontal">
                                    <div class="card-image">
                                        <img src="img/home.jpg" alt="Imagen por defecto" style="display:block; margin:0 auto;">
                                    </div>
                                    <div class="card-stacked">
                                        <div class="card-content">
                                            <div><b>Dirección:</b> ${item.Direccion}</div>
                                            <div><b>Ciudad:</b> ${item.Ciudad}</div>
                                            <div><b>Teléfono:</b> ${item.Telefono}</div>
                                            <div><b>Código Postal:</b> ${item.Codigo_Postal}</div>
                                            <div><b>Tipo:</b> ${item.Tipo}</div>
                                            <div class="precioTexto"><b>Precio:</b> ${item.Precio}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                    });
                    $('#resultados').html(html);
                },
                error: function(xhr, status, error) {
                    console.error('Error al cargar data-1.json:', error);
                    
                    $.ajax({
                        url: baseUrl,
                        method: 'GET',
                        dataType: 'json',
                        success: function(data) {
                            console.log('Datos recibidos del PHP:', data);
                            procesarDatos(data, filtros);
                        },
                        error: function() {
                            console.error('Error al cargar datos del PHP también');
                            mostrarDatosEjemplo();
                        }
                    });
                }
            });
        }
        
        function procesarDatos(data, filtros) {
            if (!data || data.length === 0) {
                $('#resultados').html('<div class="card-panel yellow lighten-4">No se encontraron resultados</div>');
                return;
            }
            
            let datosFiltrados = data;
            
            if (filtros.ciudad && filtros.ciudad !== "") {
                datosFiltrados = datosFiltrados.filter(item => 
                    item.Ciudad.toLowerCase() === filtros.ciudad.toLowerCase());
            }
            
            if (filtros.tipo && filtros.tipo !== "") {
                datosFiltrados = datosFiltrados.filter(item => 
                    item.Tipo.toLowerCase() === filtros.tipo.toLowerCase());
            }
            
            if (filtros.precio) {
                const [min, max] = filtros.precio.split(';');
                datosFiltrados = datosFiltrados.filter(item => {
                    const precio = parseFloat(item.Precio.replace(/[^\d.-]/g, ''));
                    return precio >= parseFloat(min) && precio <= parseFloat(max);
                });
            }
            
            if (datosFiltrados.length === 0) {
                $('#resultados').html('<div class="card-panel yellow lighten-4">No se encontraron resultados con los filtros seleccionados</div>');
                return;
            }
            
            let html = '';
            datosFiltrados.forEach(function(item) {
                html += `
                    <div class="itemMostrado">
                        <div class="card horizontal">
                            <div class="card-image">
                                <img src="img/home.jpg" alt="Imagen por defecto" style="display:block; margin:0 auto;">
                            </div>
                            <div class="card-stacked">
                                <div class="card-content">
                                    <div><b>Dirección:</b> ${item.Direccion}</div>
                                    <div><b>Ciudad:</b> ${item.Ciudad}</div>
                                    <div><b>Teléfono:</b> ${item.Telefono}</div>
                                    <div><b>Código Postal:</b> ${item.Codigo_Postal}</div>
                                    <div><b>Tipo:</b> ${item.Tipo}</div>
                                    <div class="precioTexto"><b>Precio:</b> ${item.Precio}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            $('#resultados').html(html);
        }
        
        function mostrarDatosEjemplo() {
            const datosEjemplo = [
                {
                    "Id": 1,
                    "Direccion": "Av. Siempre Viva 123",
                    "Ciudad": "Springfield",
                    "Telefono": "555-1234",
                    "Codigo_Postal": "12345",
                    "Tipo": "Casa",
                    "Precio": "$100,000"
                },
                {
                    "Id": 2,
                    "Direccion": "Calle Falsa 123",
                    "Ciudad": "Miami",
                    "Telefono": "555-5678",
                    "Codigo_Postal": "33101",
                    "Tipo": "Apartamento",
                    "Precio": "$200,000"
                }
            ];
            
            console.log('Mostrando datos de ejemplo');
            let html = '';
            datosEjemplo.forEach(function(item) {
                html += `
                    <div class="itemMostrado">
                        <div class="card horizontal">
                            <div class="card-image">
                                <img src="img/home.jpg" alt="Imagen por defecto" style="display:block; margin:0 auto;">
                            </div>
                            <div class="card-stacked">
                                <div class="card-content">
                                    <div><b>Dirección:</b> ${item.Direccion}</div>
                                    <div><b>Ciudad:</b> ${item.Ciudad}</div>
                                    <div><b>Teléfono:</b> ${item.Telefono}</div>
                                    <div><b>Código Postal:</b> ${item.Codigo_Postal}</div>
                                    <div><b>Tipo:</b> ${item.Tipo}</div>
                                    <div class="precioTexto"><b>Precio:</b> ${item.Precio}</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
            });
            $('#resultados').html(html);
        }
        
        $('#mostrarTodos').on('click', function() {
            console.log('Botón Mostrar Todos clickeado');
            mostrarResultados();
            return false;
        });
        
        $('#formulario').on('submit', function(e) {
            e.preventDefault();
            
            const ciudad = $('#selectCiudad').val();
            const tipo = $('#selectTipo').val();
            const precio = $('#rangoPrecio').val();
            
            console.log('Filtros seleccionados:', { ciudad, tipo, precio });
            
            mostrarResultados({
                ciudad: ciudad,
                tipo: tipo,
                precio: precio
            });
            
            return false;
        });
    });
  </script>
</body>
</html>
